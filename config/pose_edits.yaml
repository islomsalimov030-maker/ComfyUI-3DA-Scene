# E10: правка позы ручками 3D-окна (ключ pose_edits в body_transform; tools/scene3d/posev2/pose_ik.py и web/poseRig.js).
# Отдельный файл, а не раздел placement.yaml: placement.yaml входит в ключ кэша постановки (manual_pose.placement_key),
# его правка пересчитала бы все постановки и сбросила открытые у художников сцены 3D-окна.
max_offset_m: 0.8        # ручка сдвинута дальше — ошибка (сбой фронтенда), а не поза
spine_max_deg: 45.0      # предельный суммарный изгиб корпуса (поровну на 3 позвонка), градусы
spine_split: [1, 0, 0]   # доли изгиба в 3 позвонках (снизу вверх): [1, 0, 0] — шарнир в тазу, весь корпус выше едет жёстко;
                         # [1, 1, 1] — поровну (прежнее поведение, при нём у риска MPFB руки и грудь проходят сквозь живот и бёдра:
                         # E10c, reports/e10c/integrity.json)
spine_iters: 4           # уточнений угла изгиба, чтобы направление таз→грудь совпало с целью
reach_eps: 1.0e-6        # недостижимая цель: рука/нога выпрямляется до (1-eps)·длины (доля длины)
blend_m: 0.04            # ширина смешивания весов у суставов, м (диффузия меток по рёбрам меша)
blend_iters_min: 4       # пределы числа шагов диффузии (шагов ≈ 2·(blend_m/среднее ребро)²)
blend_iters_max: 200
weight_min: 0.01         # вес кости меньше — отбрасывается (до 4 костей на вершину)
seed_candidates: 64      # ближайших вершин-кандидатов для затравки метки кости
straight_deg: 170.0      # угол в локте/колене больше — конечность «прямая»: сгиб по анатомической подсказке
                         # (колено — к носку, локоть — назад/вниз), а не по смещению сустава (у прямой ноги MHR
                         # это шум в пару мм, часто в обратную сторону; иначе сустав выгнулся бы назад)
