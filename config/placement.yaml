# E1 (0.3.31): узел 3DAPlaceCandidates / tools/scene3d/posev2/candidates.py — кандидаты постановки и их оценка.
# Старый 3DAPlacePose этот раздел не читает.
candidates:
  max_seconds: 900            # общий лимит узла на строку; не уложился — лучший из готовых
  cache:                      # E6: дисковый кэш кандидатов (ключ — входы без pick): смена pick — без пересчёта
    keep: 64                  # сколько последних записей (строка × variant_set) держать; запись ~10–40 МБ
    tmp_age_s: 86400          # брошенная недописанная запись старше суток — удаляется при чистке
  variant_sets:               # E6: variant_set > 0 — второй/третий прогон, когда зрение забраковало все кандидаты
    yaws_deg: [180, 90, -90, 45, -45]   # 1 — другие развороты базовых мест (+180 первым: спиной/лицом)
    shifts_m: [[0.5, 0.0], [-0.5, 0.0], [0.0, 0.5], [0.0, -0.5]]   # 2 — соседние места (body_dx, body_dy) после
                              # опор, не вошедших в набор 0 (включая запасные fallback_only)
  vision:                     # E6: узел 3DAVisionPick и драйвер итераций
    max_rounds: 3             # прогонов «кандидаты → модель» на строку; после — «художнику»
    variant_order: [0, 1, 2]  # variant_set по номеру прогона
  cli_timeout_s: 600          # лимит одного кандидата = штатный 3DAPlacePose (420 с обрывал скамью лёжа, S19)
  floor_merge_skip: [stand]   # пол без однозначного пола: куски пола одной опорой (e1_merge_ids) — кроме этих классов
  furniture_attempts: 2       # ячеек зоны на одну мебельную опору (штатно place.attempts = 5): опоры перебирают кандидаты
  zone_relax_frac: 0.4        # no_target по zone_too_small → повтор: маска опоры ≥ 0.4 × след тела (штатно 1.0);
                              # след таза и бёдер 2.3-метрового тела ~0.39 м², видимый кусок сиденья дивана бывает 0.17 м²
  zone_relax_support_parts:   # в том же повторе — опорные части по классу (штатно pack_cli.DEFAULT_SUPPORT):
    sit_edge: [pelvis]        # бёдра над невидимой частью сиденья не «висят» — там просто нет маски
    sit_tucked: [pelvis]
    lie: [pelvis, torso]
  settle:                     # тело над опорой (wrong_surface/contact_fail по зазору) → то же место ниже на body_dz
    statuses: [wrong_surface, contact_fail]
    target_m: 0.02            # дальняя опорная часть (медиана зазора) — до 2 см (часть «на опоре» при ≤ place.on_surf_m 4 см)
    sink_m: 0.02              # ближняя часть уходит в опору не больше 2 см (жёсткий допуск place.pen_hard_m 3 см)
    max_m: 0.08               # больше — это не «чуть выше», а другая постановка
    min_m: 0.005
    rounds: 2                 # повторов на кандидата (каждый — постановка из кэша и проверка, секунды)
  floor_band_m: 0.12          # |высота − пол| ≤ этого — уровень пола (обрывки пола surf_N, коврик)
  max_cells: 1500             # подвыборка ячеек маски поверхности для расстояний между кусками
  extent_percentiles: [2, 98] # длина/ширина следа группы по главным осям
  geometry:                   # геометрические метки авто-поверхностей (высоты — над полом, м)
    group_dh_m: 0.30          # куски одной мебели: разница высот не больше…
    group_link_m: 0.12        # …и ячейки ближе этого (кровать, разбитая на корзины высоты 2 см)
    merge_dh_m: 0.08          # куски группы в пределах этой высоты от опоры — одна опора (e1_merge_ids)
    seat_h: [0.25, 0.68]      # высота сиденья/лежанки над полом (мебель обычного размера)
    back_dh_m: [0.20, 0.65]   # спинка дивана выше сиденья на столько…
    back_link_m: 0.90         # …и не дальше этого по горизонтали от сиденья
    bed_min_l_m: 1.60         # след группы ≥ 1.6 × 1.0 м при высоте сиденья — кровать
    bed_min_w_m: 1.00
    bench_min_len_m: 0.90     # верх на высоте сиденья длиннее — скамья, даже если узкий и маленький по площади
    bench_max_w_m: 0.60       # длинный и не шире этого ниже сиденья (low_bench_h) — тоже скамья (спортивная)
    low_bench_h: [0.10, 0.25]
    small_top_max_area_m2: 0.35   # верх меньше (на высоте сиденья или стола) — тумба/табурет
    small_seat_max_h_m: 0.60  # маленький верх не выше этого (и в seat_h) — «seat»: табурет, пуф, край скамьи за кадром;
                              # выше — тумба (0.73–0.75 в наборе); опора сидя только без другой мебели (fallback_only)
    table_h: [0.25, 1.05]     # верх стола/тумбы/массажного стола
  synonyms:                   # слова для подсказки hint_json.support и для таблицы классов
    floor: [mat, rug, ground]
    bed: [mattress]
    sofa: [couch, seat, armchair, loveseat]
    bench: [seat, chair, ottoman, massage_table]
    table: [desk, massage_table, counter]
    nightstand: [cabinet, dresser, side_table]
    seat: [stool, ottoman, pouf]
    shelf: []
    backrest: []              # верх спинки дивана — не опора
  support_by_class:           # опоры по классу позы в порядке приоритета; deny — не годятся
    sit_edge: {allowed: [sofa, couch, armchair, chair, bench, bed, stool, ottoman, massage_table],
               deny: [nightstand, cabinet, dresser, shelf, table, desk, floor], fallback_only: [seat]}
    sit_tucked: {allowed: [sofa, couch, armchair, chair, bench, bed, stool, ottoman, massage_table],
                 deny: [nightstand, cabinet, dresser, shelf, table, desk, floor], fallback_only: [seat]}
    recline: {allowed: [bed, sofa, couch, bench, massage_table, mat, floor], deny: [nightstand, shelf, stool, seat]}
    lie: {allowed: [bed, sofa, couch, bench, massage_table, mat, floor], deny: [nightstand, shelf, stool, seat]}
    kneel: {allowed: [floor, mat], deny: []}
    crouch: {allowed: [floor, mat], deny: []}
    sit_floor: {allowed: [floor, mat], deny: []}
    all_fours: {allowed: [floor, mat], deny: []}
    stand: {allowed: [floor], deny: []}
  wall_parts: [back]          # «у стены» (hint near_wall): штатный secondary_contacts <часть>:wall
  stand_yaws_deg: [25, -25]   # свободно стоя: доп. развороты к референсу (по одному кандидату)
  flip_flags: [side_flip, side_conflict]   # флаги отчёта → вариант разворота +180 у мебели
  back_gap_flip_cm: 15.0      # спинка дальше этого — тоже вариант +180
  typical_sizes:              # типовые высоты (м) для room_scale; только смысловые имена объектов
    door: [2.00, 2.10]
    sofa: [0.40, 0.50]
    couch: [0.40, 0.50]
    chair: [0.40, 0.50]
    armchair: [0.40, 0.50]
    table: [0.72, 0.78]
    desk: [0.72, 0.78]
    bed: [0.45, 0.60]
  scale_from_geometry_labels: false  # геометрические метки выведены из высоты — по ним масштаб не считаем
  room_scale_tol: 0.15        # |room_scale − 1| больше — room_scale_suspect и кандидат с height_m / room_scale
  weights:                    # итоговая оценка 0..1 = Σ вес·составляющая / Σ весов
    status: 0.35
    gap: 0.10
    penetration: 0.10
    pose_match: 0.10
    support_class: 0.25
    visibility: 0.10
  score:
    status: {ok: 1.0, partial: 0.7, out_of_frame: 0.3, contact_fail: 0.2, wrong_surface: 0.1, no_target: 0.0, fallback: 0.0}
    gap_scale_cm: 5.0
    pen_scale_cm: 10.0
    pose_scale_deg: 45.0
    ref_error_deg_per_m: 100.0
    pose_unknown: 0.5
    support_unknown: 0.5
    support_tier1: 0.6        # опора годится только по синониму (стол → массажный стол)
    support_tier2: 0.4        # запасная опора fallback_only (маленькое «сиденье»)
    support_step: 0.05        # минус за каждую позицию в списке класса
    partly_visible: 0.5

# E2 (0.3.36): паспорт локации — узел 3DALocationPassport / tools/scene3d/posev2/passport.py; вход passport у
# 3DAPlaceCandidates. Старые узлы этот раздел не читают.
passport:
  hull_max_points: 32         # контур опорной плоскости в паспорте — выпуклая оболочка, не больше стольких вершин
  kinds:                      # тип объекта -> вид опорной плоскости (seat вне candidates.geometry.seat_h -> top)
    floor: floor
    bed: bed
    sofa: seat
    bench: seat
    seat: seat
    table: top
    nightstand: top
    shelf: top
  defer_baseline: true        # с паспортом запасной «пол» для сидя ставится, только если мебель не дала тела
